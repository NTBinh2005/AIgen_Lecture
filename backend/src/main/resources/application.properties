spring.application.name=demo
spring.config.import=optional:file:.env[.properties]

# DataSource
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/aigen_lecture
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Cho phép data.sql chạy sau khi JPA tạo schema (cần cho seed data)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Video service config (Remotion microservice)
video.service.url=${VIDEO_SERVICE_URL:http://localhost:3001}

# Job processing timeout
app.lecture.job-timeout-minutes=${APP_LECTURE_JOB_TIMEOUT_MINUTES:20}

# Async executor
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=video-async-


# JWT Configuration
jwt.secret=${JWT_SECRET:edumind-super-secret-key-for-jwt-signing-must-be-at-least-512-bits-long-2026}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# Refresh Token — 30 ngày (ms)
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:2592000000}

# Gemini API Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent

# File Upload Limit (BR-01). The request limit includes multipart overhead.
spring.servlet.multipart.max-file-size=${APP_MAX_UPLOAD_SIZE:500MB}
spring.servlet.multipart.max-request-size=${APP_MAX_REQUEST_SIZE:501MB}
server.tomcat.max-swallow-size=-1

# Maximum size for lecture/presentation source documents (500 MiB).
app.asset.max-source-size-bytes=${APP_ASSET_MAX_SOURCE_SIZE_BYTES:524288000}

app.cors.allowed-origins=http://localhost:5173,http://localhost:80

# Google login. Set this to your Web OAuth Client ID from Google Cloud Console.
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID}

# SMS OTP login. Without Twilio credentials, OTP codes are logged for local testing.
auth.sms.otp-expiration-seconds=${AUTH_SMS_OTP_EXPIRATION_SECONDS:300}
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.from-number=${TWILIO_FROM_NUMBER:}

# ─── LIVE Module ─────────────────────────────────────────────────────────────
# LIVE-02: Join token TTL (giây) — LIVE-AC-01
live.join-token.expiry-seconds=${LIVE_JOIN_TOKEN_EXPIRY:300}

# LIVE-06: QR code TTL (giây) — LIVE-BR-03
live.qr.expiry-seconds=${LIVE_QR_EXPIRY:600}

# LIVE-BR-02: Ngưỡng điểm danh tối thiểu (% thời lượng buổi học)
live.attendance.min-percentage=${LIVE_ATTENDANCE_MIN_PCT:50}

# LIVE overlap policy: false = chặn trùng lịch, true = chỉ cảnh báo
live.schedule.allow-overlap=${LIVE_ALLOW_OVERLAP:false}

# LIVE-BR-05: Webhook secret cho HMAC-SHA256 (thay đổi trong production)
live.webhook.secret=${LIVE_WEBHOOK_SECRET:change-me-in-production}

# Shared secret used by Backend 1 when delivering PaymentSucceeded events.
internal.events.token=${INTERNAL_EVENTS_TOKEN:}

# Gmail SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# Quiz Module Configuration
app.quiz.grace-period-seconds=0
app.quiz.export.retention-days=7
app.quiz.ai-timeout-minutes=5
app.quiz.ai.enabled=true
app.quiz.export.storage-dir=exports
app.quiz.auto-submit-sweep-interval=60000
app.quiz.export-poll-interval=5000
