server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Asset đã có hash trong tên file → cache lâu dài
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router: route không phải file tĩnh → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
