
services:
  # ────────────────────────────────────────────────────────────────────
  # PostgreSQL — Main database for Spring Boot backend
  # ────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: aigen-lecture-postgres
    environment:
      POSTGRES_DB: aigen_lecture
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Bound to localhost for security on EC2. Backend connects via internal network.
      - "127.0.0.1:5436:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aigen_lecture"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ────────────────────────────────────────────────────────────────────
  # Backend — Spring Boot Application
  # ────────────────────────────────────────────────────────────────────
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: aigen-lecture-backend
    ports:
      - "8081:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/aigen_lecture
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # Đổi model khi bị 503 "high demand": đặt GEMINI_API_URL trong .env (ghi đè gemini.api.url của backend)
      - GEMINI_API_URL=${GEMINI_API_URL:-https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - JWT_SECRET=${JWT_SECRET:-edumind-super-secret-key-for-jwt-signing-must-be-at-least-512-bits-long-2026}
      # Hạn access token (mặc định 1 ngày) và refresh token (mặc định 30 ngày), tính bằng ms
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:-86400000}
      - JWT_REFRESH_EXPIRATION_MS=${JWT_REFRESH_EXPIRATION_MS:-2592000000}
      # Đăng nhập bằng SMS OTP (Twilio) — để trống nếu không dùng
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_FROM_NUMBER=${TWILIO_FROM_NUMBER:-}
      - AUTH_SMS_OTP_EXPIRATION_SECONDS=${AUTH_SMS_OTP_EXPIRATION_SECONDS:-300}
      # FIX #12: Khi deploy thật, đặt APP_ENFORCE_SECRETS=true (trong .env) VÀ cấp JWT_SECRET,
      # LIVE_WEBHOOK_SECRET thật — app sẽ từ chối khởi động nếu secret vẫn để mặc định.
      - APP_SUBSCRIPTIONS_ENFORCE_PREMIUM=${APP_SUBSCRIPTIONS_ENFORCE_PREMIUM:-true}
      - APP_SWAGGER_ENABLED=${APP_SWAGGER_ENABLED:-false}
      - APP_ENFORCE_SECRETS=${APP_ENFORCE_SECRETS:-false}
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL:-}
      - BREVO_SENDER_NAME=${BREVO_SENDER_NAME:-EduMind}
      - INTERNAL_EVENTS_TOKEN=${INTERNAL_EVENTS_TOKEN:-}
      - LIVE_WEBHOOK_SECRET=${LIVE_WEBHOOK_SECRET:-change-me-in-production}
      # SePay: tài khoản nhận tiền và secret HMAC không có giá trị mặc định.
      - SEPAY_BANK_ACCOUNT=${SEPAY_BANK_ACCOUNT:-}
      - SEPAY_BANK_NAME=${SEPAY_BANK_NAME:-}
      - SEPAY_WEBHOOK_ACCOUNT_NUMBER=${SEPAY_WEBHOOK_ACCOUNT_NUMBER:-}
      - SEPAY_REFUND_SOURCE_ACCOUNT=${SEPAY_REFUND_SOURCE_ACCOUNT:-}
      - SEPAY_ACCOUNT_HOLDER=${SEPAY_ACCOUNT_HOLDER:-}
      - SEPAY_WEBHOOK_SECRET=${SEPAY_WEBHOOK_SECRET:-}
      - SEPAY_PAYMENT_CODE_PREFIX=${SEPAY_PAYMENT_CODE_PREFIX:-DH}
      - SEPAY_PENDING_EXPIRATION_MINUTES=${SEPAY_PENDING_EXPIRATION_MINUTES:-15}
      - SEPAY_PENDING_EXPIRATION_SWEEP_MS=${SEPAY_PENDING_EXPIRATION_SWEEP_MS:-60000}
      - SEPAY_QR_BASE_URL=${SEPAY_QR_BASE_URL:-https://vietqr.app/img}
      - SEPAY_WEBHOOK_TOLERANCE_SECONDS=${SEPAY_WEBHOOK_TOLERANCE_SECONDS:-300}
      # Buổi học trực tiếp: cho phép trùng lịch, % thời lượng tối thiểu để tính có mặt, hạn token tham gia / mã QR điểm danh (giây)
      - LIVE_ALLOW_OVERLAP=${LIVE_ALLOW_OVERLAP:-false}
      - LIVE_ATTENDANCE_MIN_PCT=${LIVE_ATTENDANCE_MIN_PCT:-50}
      - LIVE_JOIN_TOKEN_EXPIRY=${LIVE_JOIN_TOKEN_EXPIRY:-300}
      - LIVE_QR_EXPIRY=${LIVE_QR_EXPIRY:-600}
      # Giới hạn tải tài liệu lên (giữ 3 giá trị này khớp nhau)
      - APP_MAX_UPLOAD_SIZE=${APP_MAX_UPLOAD_SIZE:-20MB}
      - APP_MAX_REQUEST_SIZE=${APP_MAX_REQUEST_SIZE:-21MB}
      - APP_ASSET_MAX_SOURCE_SIZE_BYTES=${APP_ASSET_MAX_SOURCE_SIZE_BYTES:-20971520}
      - VIDEO_SERVICE_URL=http://video-service:3001
      - APP_VIDEO_ENABLED=${APP_VIDEO_ENABLED:-true}
      - APP_VIDEO_POLL_INTERVAL_MS=${APP_VIDEO_POLL_INTERVAL_MS:-15000}
      # slide-ai-service: đặt SLIDE_AI_SERVICE_URL= (rỗng) trong .env để tắt và dùng luồng Gemini cũ
      - SLIDE_AI_SERVICE_URL=${SLIDE_AI_SERVICE_URL-http://slide-ai-service:5100}
      - SLIDE_AI_TOKEN=${SLIDE_AI_TOKEN:-}
      - APP_CORS_ALLOWED_ORIGINS=${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:80,http://localhost}
      - APP_LECTURE_JOB_TIMEOUT_MINUTES=${JOB_TIMEOUT_MINUTES:-120}
      - APP_DOCUMENT_OCR_ENABLED=${APP_DOCUMENT_OCR_ENABLED:-true}
      - APP_DOCUMENT_OCR_MAX_PAGES=${APP_DOCUMENT_OCR_MAX_PAGES:-30}
      - APP_DOCUMENT_OCR_DPI=${APP_DOCUMENT_OCR_DPI:-200}
      - APP_DOCUMENT_OCR_LANGUAGES=${APP_DOCUMENT_OCR_LANGUAGES:-vie+eng}
      - APP_DOCUMENT_MAX_EXTRACTED_CHARACTERS=${APP_DOCUMENT_MAX_EXTRACTED_CHARACTERS:-60000}
    volumes:
      # File export quiz (app.quiz.export.storage-dir=exports) — giữ lại khi rebuild container
      - backend-exports:/app/exports
    depends_on:
      postgres:
        condition: service_healthy # Waits for DB to be fully ready before starting
      video-service:
        condition: service_healthy # Avoid marking pending lectures failed during startup
    restart: unless-stopped

  # ────────────────────────────────────────────────────────────────────
  # Avatar AI Service — animated 3D teacher, optional SadTalker engine
  # ────────────────────────────────────────────────────────────────────
  avatar-ai-service:
    build:
      context: ./avatar-ai-service
      dockerfile: Dockerfile
    container_name: aigen-lecture-avatar-ai-service
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      PORT: "5000"
      SERVER_URL: "http://avatar-ai-service:5000"
      AVATAR_ENGINE: "${AVATAR_ENGINE:-fallback}"
      DEFAULT_AVATAR_IMAGE: "/app/assets/avatar_teacher_3d.png"
      MAX_CONCURRENT_AVATARS: "${MAX_CONCURRENT_AVATARS:-1}"
    volumes:
      - avatar-output:/app/outputs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ────────────────────────────────────────────────────────────────────
  # Slide AI Service — Python, slide nhiều bố cục (Ollama trên laptop, dự phòng Gemini)
  # Xem slide-ai-service/README.md để cấu hình Ollama qua Tailscale.
  # ────────────────────────────────────────────────────────────────────
  slide-ai-service:
    build:
      context: ./slide-ai-service
      dockerfile: Dockerfile
    container_name: aigen-lecture-slide-ai-service
    ports:
      - "127.0.0.1:5100:5100"
    environment:
      SLIDE_AI_PROVIDER: "${SLIDE_AI_PROVIDER:-auto}"
      # Local: Ollama trên Windows. Server: OLLAMA_URL=http://<IP Tailscale của laptop>:11434
      OLLAMA_URL: "${OLLAMA_URL:-http://host.docker.internal:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen3.5:4b}"
      OLLAMA_TIMEOUT: "${OLLAMA_TIMEOUT:-300}"
      OLLAMA_QUEUE_WAIT: "${OLLAMA_QUEUE_WAIT:-30}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_API_URL: "${GEMINI_API_URL:-}"
      SLIDE_AI_TOKEN: "${SLIDE_AI_TOKEN:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ────────────────────────────────────────────────────────────────────
  # Video Service — Node.js + Remotion render engine
  # ────────────────────────────────────────────────────────────────────
  video-service:
    build:
      context: ./video-service
      dockerfile: Dockerfile
    container_name: aigen-lecture-video-service
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      VIDEO_PUBLIC_BASE_URL: "${VIDEO_PUBLIC_BASE_URL:-http://localhost:3001}"
      TTS_PROVIDER: "${TTS_PROVIDER:-google}"
      ELEVENLABS_API_KEY: "${ELEVENLABS_API_KEY:-}"
      POLLINATIONS_API_KEY: "${POLLINATIONS_API_KEY:-}"
      POLLINATIONS_IMAGE_MODEL: "${POLLINATIONS_IMAGE_MODEL:-flux}"
      SCENE_VIDEO_PROVIDER: "${SCENE_VIDEO_PROVIDER:-none}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      VEO_MODEL: "${VEO_MODEL:-veo-3.1-fast-generate-preview}"
      VEO_TIMEOUT_MS: "${VEO_TIMEOUT_MS:-420000}"
      VEO_POLL_INTERVAL_MS: "${VEO_POLL_INTERVAL_MS:-10000}"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      UPLOAD_TO_SUPABASE: "${UPLOAD_TO_SUPABASE:-false}"
      SUPABASE_URL: "${SUPABASE_URL:-}"
      SUPABASE_SERVICE_ROLE_KEY: "${SUPABASE_SERVICE_ROLE_KEY:-}"
      SUPABASE_BUCKET_NAME: "${SUPABASE_BUCKET_NAME:-lecture-videos}"
      MAX_CONCURRENT_RENDERS: "${MAX_CONCURRENT_RENDERS:-1}"
      AVATAR_PROVIDER: "${AVATAR_PROVIDER:-2d-viseme}"
      SADTALKER_API_URL: "http://avatar-ai-service:5000/api/talk"
      VIDEO_SERVICE_INTERNAL_URL: "http://video-service:3001"
      AVATAR_IMAGE_URL: "${AVATAR_IMAGE_URL:-}"
      # The Docker avatar image intentionally contains only the lightweight
      # fallback. Opt into strict lip-sync only with a SadTalker-capable image.
      REQUIRE_LIP_SYNCED_AVATAR: "${REQUIRE_LIP_SYNCED_AVATAR:-false}"
    volumes:
      - video-output:/app/out
    shm_size: "2gb"  # CRITICAL: Prevents Chromium headless from crashing during rendering
    depends_on:
      avatar-ai-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # FIX: Uses native Node.js fetch instead of curl, which isn't installed in slim images
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3

  # ────────────────────────────────────────────────────────────────────
  # Frontend — React/Vite (served via Nginx)
  # ────────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Replace this with your actual EC2 public IP or domain when deploying
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8081/api}
    container_name: aigen-lecture-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
  video-output:
  avatar-output:
  backend-exports:
